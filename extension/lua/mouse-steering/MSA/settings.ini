[SETTINGS]
SMOOTHNESS=0.5 ; Smoothness (How smooth is a change); from 0 to 1, perc
DOFFB=true ; Do FFB (Do force feedback or not)
FFBSENS=0.3 ; FFB sensitivity (How much is the 'force' of FFB); from 0 to 1
SCROLL=0.1 ; Scroll (Pedals percentage change on each scroll change); from 0 to 1, perc
THROTTLE=W ; Throttle key (Key to press for throttle while scrolling mouse wheel)
BRAKE=S ; Brake key (Key to press for brake while scrolling mouse wheel)
ALTTHROTTLE= ; Alternative throttle key
ALTBRAKE= ; Alternative brake key
FORCEDAMOUNT=1 ; Forced pedals amount (How much is the percentage of pedals on forced pedals); from 0 to 1, perc
ONPRESS=0.33 ; Pedals press amount (How much is the percentage of pedals on press); from 0 to 1, perc
__HINT_BOTTOM=To use mouse buttons as throttle/brake key, type LeftButton/RightButton.